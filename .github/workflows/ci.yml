name: CI

# Additive by design: other waves attach their own jobs here (image
# factory builds, boot tests). The go job gates every appliance change.
on:
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  go:
    name: go / test+lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: appliance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: appliance/go.mod
          cache-dependency-path: appliance/go.sum
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: appliance
