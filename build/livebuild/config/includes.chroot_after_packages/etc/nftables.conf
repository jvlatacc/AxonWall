#!/usr/sbin/nft -f
# AxonWall baseline ruleset — safe-by-default posture for the bare image.
#
# flush + replace in ONE file keeps every application atomic and idempotent
# (nft -f submits the whole file as a single kernel transaction). axond is the
# runtime owner of the real ruleset and re-renders this on config change; hand
# edits are out of model.

flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;
		iifname "lo" accept
		ct state established,related accept
		ct state invalid drop
		meta l4proto ipv6-icmp accept comment "IPv6 neighbor discovery and control"
		ip protocol icmp accept
		tcp dport 22 accept comment "management SSH (key-only; tightened by axond)"
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
