# AxonWall baked-in SSH hardening (spec: key-only SSH).
# INSTALLED-SYSTEM COPY of build/livebuild/config/includes.chroot_after_packages/
# etc/ssh/sshd_config.d/10-axonwall-hardening.conf — keep in sync.
# First-boot setup provisions admin keys; until then, key auth is the only path.
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitRootLogin prohibit-password
X11Forwarding no
AllowAgentForwarding no
