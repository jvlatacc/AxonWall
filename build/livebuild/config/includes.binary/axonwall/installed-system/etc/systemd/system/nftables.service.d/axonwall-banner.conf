# Emits the deterministic firewall-active marker on the appliance console
# (/dev/console resolves to the serial line via the console= kernel parameters).
# The CI install test asserts on this string after rebooting from disk — keep it
# stable.
[Service]
ExecStartPost=/bin/sh -c '/bin/echo "AxonWall: firewall active (nftables ruleset applied)" > /dev/console'
