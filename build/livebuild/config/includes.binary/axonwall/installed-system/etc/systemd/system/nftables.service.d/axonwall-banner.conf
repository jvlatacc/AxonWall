# Emits the canonical firewall-active marker on the appliance console —
# /dev/console follows the last console= kernel parameter (the serial line on
# headless boots and in CI). ExecStartPost runs only after ExecStart committed
# the baseline ruleset via nft -f (default-drop forward policy included), so
# the marker certifies the firewall is actually live — it cannot fire on a
# failed ruleset load. Same string as axond's marker (appliance/cmd/axond/marker.go)
# and the live-boot banner (includes.chroot_after_packages/.../axonwall-banner.conf);
# the CI install test asserts on it after rebooting from disk.
[Service]
ExecStartPost=/bin/sh -c '/bin/echo "AXONWALL: FIREWALL ACTIVE" > /dev/console'
