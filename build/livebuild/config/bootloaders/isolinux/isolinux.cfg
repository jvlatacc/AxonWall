# AxonWall override (BIOS isolinux): serial-console boot menu + a real timeout.
# The system template (usr/share/live/build/bootloaders/isolinux/isolinux.cfg) has
# no SERIAL directive (headless-first appliance: the menu must speak ttyS0) and
# timeout 0 (sit at the menu forever — wrong for unattended VM boots and for the
# CI install test, which must be able to select the installer entry). binary_syslinux
# copies this over the template copy (user bootloader dir wins).
# SERIAL must be the first directive; VGA stays active (no console 0).
serial 0 115200
default vesamenu.c32
prompt 0
timeout 100
include menu.cfg
